[project]
name = "botspace-mcp"
version = "0.2.0"
description = "BotSpace MCP Server — manage Telegram bots from any AI agent"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "starlette",
    "uvicorn",
    "prometheus-client>=0.21.0",
]

[project.scripts]
botspace-mcp = "botspace_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
